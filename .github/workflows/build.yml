name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Download Gradle wrapper (if missing)
        run: |
          if [ ! -f android/gradle/wrapper/gradle.zip ]; then
            mkdir -p android/gradle/wrapper
            curl -L -o android/gradle/wrapper/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          fi

      # ✅ مرحله جدید: دانلود خودکار فایل AAR شرپا
      - name: Download Sherpa-ONNX AAR
        run: |
          mkdir -p android/app/libs
          curl -L --retry 3 --retry-delay 5 \
            -o android/app/libs/sherpa-onnx-static-link-onnxruntime-1.12.8.aar \
            "https://huggingface.co/csukuangfj/sherpa-onnx-libs/resolve/main/android/aar/1.12.8/sherpa-onnx-static-link-onnxruntime-1.12.8.aar"
          ls -lh android/app/libs/

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingoLearn-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
