# ورک‌فلو ساخت APK
# - فایل‌های build شده‌ی Hope داخل APK قرار می‌گیرن (پوشه‌ی www)
# - APK نهایی با Keystore اختصاصی امضا می‌شه
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ۱) ریپوی خودِ اپ اندروید
      - name: Checkout linlearn-App
        uses: actions/checkout@v4

      # ۲) ریپوی وب‌اپ Hope
      # اگه Hope private باشه، توکن لازمه: token: ${{ secrets.HOPE_TOKEN }}
      - name: Checkout Hope web app
        uses: actions/checkout@v4
        with:
          repository: maryam1998/Hope
          path: Hope-build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ۳) اگه باندل Hope نبود، با esbuild می‌سازیمش
      - name: Build Hope bundle (only if missing)
        run: |
          cd Hope-build
          if [ ! -f app.bundle.min.js ]; then
            echo "app.bundle.min.js not found, building with esbuild..."
            npx --yes esbuild@0.27.7 app.jsx \
              --bundle --minify --format=esm --target=es2020 \
              --loader:.js=jsx \
              --external:react \
              --external:react-dom \
              --external:react-dom/client \
              --external:lucide-react \
              --external:@supabase/supabase-js \
              --external:firebase/app \
              --external:firebase/auth \
              --external:firebase/firestore \
              --external:pdfjs-dist \
              --external:pdf-lib \
              --outfile=app.bundle.min.js
          else
            echo "app.bundle.min.js already exists, skipping build."
          fi

      # ۴) کپی فایل‌های لازم به www
      - name: Copy Hope build to www
        run: |
          rm -rf www
          mkdir -p www
          cp Hope-build/index.html          www/
          cp Hope-build/app.bundle.min.js   www/
          cp Hope-build/manifest.json       www/
          cp Hope-build/sw.js               www/
          cp -r Hope-build/icons            www/
          [ -d Hope-build/dictionaries ] && cp -r Hope-build/dictionaries www/ || true
          [ -d Hope-build/src ]          && cp -r Hope-build/src          www/ || true
          test -f www/index.html || { echo "ERROR: www/index.html missing"; exit 1; }
          test -f www/app.bundle.min.js || { echo "ERROR: www/app.bundle.min.js missing"; exit 1; }
          ls -la www/

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ۵) Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # ۶) بررسی فایل‌های داخل Android project
      - name: Verify web assets inside Android project
        run: |
          ls -la android/app/src/main/assets/public/
          test -f android/app/src/main/assets/public/index.html || { echo "ERROR: assets not copied (check webDir)"; exit 1; }

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Download Gradle wrapper (if missing)
        run: |
          if [ ! -f android/gradle/wrapper/gradle.zip ]; then
            mkdir -p android/gradle/wrapper
            curl -L -o android/gradle/wrapper/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          fi

      - name: Download Sherpa-ONNX AAR
        run: |
          mkdir -p android/app/libs
          rm -f android/app/libs/*.aar
          curl -L --retry 3 --retry-delay 5 \
            -o android/app/libs/sherpa-onnx-1.13.4.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-1.13.4.aar"
          ls -lh android/app/libs/

      # ✅ Decode Keystore — هدر و Enter رو خودش حذف می‌کنه
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" \
            | tr -d '\r\n' \
            | sed 's/-----[A-Z ]*-----//g' \
            | base64 -d > android/app/release-key.jks
          ls -lh android/app/release-key.jks
          file android/app/release-key.jks

      # ✅ Build Release APK (امضاشده)
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LingoLearn-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
