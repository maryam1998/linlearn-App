// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://maven.aliyun.com/repository/google") }
        maven { url = uri("https://maven.aliyun.com/repository/public") }
        maven { url = uri("local-maven-repo") }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.0'
        classpath 'com.google.gms:google-services:4.4.4'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://maven.aliyun.com/repository/google") }
        maven { url = uri("https://maven.aliyun.com/repository/public") }
        maven { url = uri("local-maven-repo") }
    }

    // ⭐ این بخش حیاتی: همه‌ی کتابخانه‌های androidx رو به نسخه‌های سازگار با AGP 8.5 مجبور می‌کنه
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
            force 'androidx.core:core-splashscreen:1.0.1'
            force 'androidx.activity:activity:1.9.3'
            force 'androidx.activity:activity-ktx:1.9.3'
            force 'androidx.appcompat:appcompat:1.7.0'
            force 'androidx.fragment:fragment:1.8.5'
            force 'androidx.fragment:fragment-ktx:1.8.5'
            force 'androidx.lifecycle:lifecycle-runtime:2.8.7'
            force 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
            force 'androidx.lifecycle:lifecycle-livedata:2.8.7'
            force 'androidx.lifecycle:lifecycle-common:2.8.7'
            force 'androidx.annotation:annotation:1.9.1'
            force 'androidx.webkit:webkit:1.12.1'
            force 'androidx.browser:browser:1.8.0'
            force 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
            force 'androidx.drawerlayout:drawerlayout:1.2.0'
            force 'androidx.recyclerview:recyclerview:1.3.2'
            force 'androidx.viewpager2:viewpager2:1.1.0'
            force 'androidx.constraintlayout:constraintlayout:2.2.0'
            force 'androidx.work:work-runtime:2.10.0'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}